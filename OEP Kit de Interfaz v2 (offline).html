  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

02Fstyle>\n<script src=\"3db3f613-490b-4e44-ac78-93bab30b2d0d\" integrity=\"sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"605ee5a4-91e5-4ee4-9f22-0783d69b2721\" integrity=\"sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"df27ad7b-a13b-4b1c-b73c-a7ec6938d7a1\"><\u002Fscript>\n<style>\n  body { margin:0; background:#fff; -webkit-font-smoothing:antialiased; }\n  a { color:#0F172A; text-decoration:none; border-bottom:1px solid #CBD5E1; }\n  a:hover { color:#B45309; border-bottom-color:#B45309; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:Inter,sans-serif;color:#0F172A;background:#fff;font-variant-numeric:tabular-nums;min-width:1160px\">\n\n  <div style=\"background:#0F172A;color:#fff;padding:0\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:40px 40px 0 40px;display:grid;grid-template-columns:1fr auto;gap:40px;align-items:start;border-bottom:1px solid #334155\">\n      <div style=\"display:flex;align-items:center;gap:14px;padding-bottom:20px\">\n        <svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 80 80\"><polygon points=\"40,8 67.7,24 40,40 12.3,24\" fill=\"#F59E0B\"><\u002Fpolygon><polygon points=\"67.7,24 67.7,56 40,72 40,40\" fill=\"#10B981\"><\u002Fpolygon><polygon points=\"12.3,24 40,40 40,72 12.3,56\" fill=\"#94A3B8\"><\u002Fpolygon><\u002Fsvg>\n        <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;letter-spacing:-0.01em\">OEP<\u002Fdiv>\n        <div style=\"font-size:12px;color:#64748B\">Observatorio Económico de Permisos<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:32px;padding-bottom:20px;font-family:'Roboto Mono',monospace;font-size:11px;color:#64748B\">\n        <div>V 1.0<\u002Fdiv><div>03.09.2026<\u002Fdiv><div style=\"color:#F59E0B\">ES-CL<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:1240px;margin:0 auto;padding:96px 40px 64px 40px;display:grid;grid-template-columns:1fr 380px;gap:96px;align-items:end\">\n      <h1 style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:88px;line-height:88px;margin:0;letter-spacing:-0.035em;text-indent:-0.03em\">Kit de interfaz<br>y sistema visual<\u002Fh1>\n      <div style=\"display:flex;flex-direction:column;gap:20px;padding-bottom:12px\">\n        <div style=\"font-size:15px;line-height:23px;color:#CBD5E1;text-wrap:pretty\">Componentes, tokens y reglas de visualización para productos OEP. Las cifras son datos de muestra con estructura real.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:2px 24px;font-family:'Roboto Mono',monospace;font-size:11px;color:#64748B;border-top:1px solid #334155;padding-top:16px\">\n          <div>SECCIONES<\u002Fdiv><div style=\"color:#fff\">10<\u002Fdiv>\n          <div>SEÑALES<\u002Fdiv><div style=\"color:#fff\">2 · 5–10 %<\u002Fdiv>\n          <div>BASE DE ESPACIADO<\u002Fdiv><div style=\"color:#fff\">8 px<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1240px;margin:0 auto;padding:0 40px 128px 40px\">\n\n    <div style=\"display:grid;grid-template-columns:56px 1fr;gap:40px;border-bottom:1px solid #E2E8F0;padding:56px 0 48px 0\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;color:#94A3B8\">01<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:56px\">\n        <div style=\"grid-column:1 / 3;display:flex;flex-direction:column;gap:20px\">\n          <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:44px;line-height:48px;margin:0;letter-spacing:-0.025em;text-wrap:balance\">De permisos a inteligencia económica<\u002Fh2>\n          <p style=\"margin:0;max-width:56ch;font-size:16px;line-height:25px;color:#334155;text-wrap:pretty\">OEP mide la relación entre inversión, evaluación ambiental, permisos sectoriales y ejecución de proyectos en Chile. La interfaz se lee como un terminal de inteligencia económica: precisa, independiente, moderna y calma. No como un portal de gobierno, un medio de prensa ni un panel de <em>software<\u002Fem> genérico.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:0;font-size:14px;line-height:20px\">\n          <div style=\"display:grid;grid-template-columns:88px 1fr;gap:16px;padding:12px 0;border-top:1px solid #0F172A\"><div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#B45309;padding-top:3px\">DATA<\u002Fdiv><div style=\"color:#334155\">Expedientes, plazos, series históricas, geolocalización.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:88px 1fr;gap:16px;padding:12px 0;border-top:1px solid #E2E8F0\"><div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#B45309;padding-top:3px\">CAPITAL<\u002Fdiv><div style=\"color:#334155\">Cartera, empleo, materialización, actividad sectorial.<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:88px 1fr;gap:16px;padding:12px 0;border-top:1px solid #E2E8F0;border-bottom:1px solid #E2E8F0\"><div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#047857;padding-top:3px\">ENTORNO<\u002Fdiv><div style=\"color:#334155\">RCA, permisos sectoriales, restricciones territoriales.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:56px 1fr;gap:40px;padding:64px 0 0 0\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;color:#94A3B8\">02<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:48px\">\n        <div style=\"display:grid;grid-template-columns:1fr 380px;gap:96px;align-items:end\">\n          <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:44px;line-height:48px;margin:0;letter-spacing:-0.025em\">Símbolo<\u002Fh2>\n          <p style=\"margin:0;font-size:14.5px;line-height:22px;color:#334155;text-wrap:pretty\">Hexágono regular, ejes de 30° y 60°, tres componentes que convergen. Sin hojas, monedas, escudos ni el mapa de Chile. Lo ambiental se comunica por color y lógica de sistema.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#E2E8F0;border-top:1px solid #0F172A;border-bottom:1px solid #E2E8F0\">\n          <div style=\"background:#fff;padding:56px 32px 28px 32px;display:flex;flex-direction:column;gap:40px;align-items:flex-start\">\n            <svg width=\"132\" height=\"132\" sc-camel-view-box=\"0 0 80 80\">\n              <polygon points=\"40,8 67.7,24 40,40 12.3,24\" fill=\"#F59E0B\"><\u002Fpolygon>\n              <polygon points=\"67.7,24 67.7,56 40,72 40,40\" fill=\"#10B981\"><\u002Fpolygon>\n              <polygon points=\"12.3,24 40,40 40,72 12.3,56\" fill=\"#0F172A\"><\u002Fpolygon>\n            <\u002Fsvg>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;align-items:baseline;gap:10px\">\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px\">A · Isométrica<\u002Fdiv>\n                <sc-if value=\"{{ marcaA }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"font-family:'Roboto Mono',monospace;font-size:10px;color:#B45309\">← ELEGIDA<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:20px;color:#64748B;max-width:34ch\">El hexágono es la suma de sus tres dimensiones. La más sólida en favicon y monocromo por masa continua.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;padding:56px 32px 28px 32px;display:flex;flex-direction:column;gap:40px;align-items:flex-start\">\n            <svg width=\"132\" height=\"132\" sc-camel-view-box=\"0 0 80 80\">\n              <polygon points=\"40,8 67.7,24 67.7,56 40,72 12.3,56 12.3,24\" fill=\"none\" stroke=\"#0F172A\" stroke-width=\"5\"><\u002Fpolygon>\n              <line x1=\"40\" y1=\"40\" x2=\"40\" y2=\"10\" stroke=\"#0F172A\" stroke-width=\"5\"><\u002Fline>\n              <line x1=\"40\" y1=\"40\" x2=\"65.9\" y2=\"55\" stroke=\"#10B981\" stroke-width=\"5\"><\u002Fline>\n              <line x1=\"40\" y1=\"40\" x2=\"14.1\" y2=\"55\" stroke=\"#F59E0B\" stroke-width=\"5\"><\u002Fline>\n            <\u002Fsvg>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;align-items:baseline;gap:10px\">\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px\">B · Convergencia<\u002Fdiv>\n                <sc-if value=\"{{ marcaB }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-family:'Roboto Mono',monospace;font-size:10px;color:#B45309\">← ELEGIDA<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:20px;color:#64748B;max-width:34ch\">Tres ejes que se encuentran en un punto. Lee como red de coordinación; exige simplificarse bajo 24 px.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;padding:56px 32px 28px 32px;display:flex;flex-direction:column;gap:40px;align-items:flex-start\">\n            <svg width=\"132\" height=\"132\" sc-camel-view-box=\"0 0 80 80\">\n              <polygon points=\"40,8 67.7,24 67.7,56 40,72 12.3,56 12.3,24\" fill=\"none\" stroke=\"#CBD5E1\" stroke-width=\"4\"><\u002Fpolygon>\n              <line x1=\"40\" y1=\"8\" x2=\"67.7\" y2=\"56\" stroke=\"#F59E0B\" stroke-width=\"5\"><\u002Fline>\n              <line x1=\"67.7\" y1=\"56\" x2=\"12.3\" y2=\"56\" stroke=\"#10B981\" stroke-width=\"5\"><\u002Fline>\n              <line x1=\"12.3\" y1=\"56\" x2=\"40\" y2=\"8\" stroke=\"#0F172A\" stroke-width=\"5\"><\u002Fline>\n            <\u002Fsvg>\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"display:flex;align-items:baseline;gap:10px\">\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:17px\">C · Intersección<\u002Fdiv>\n                <sc-if value=\"{{ marcaC }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"font-family:'Roboto Mono',monospace;font-size:10px;color:#B45309\">← ELEGIDA<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n              <p style=\"margin:0;font-size:14px;line-height:20px;color:#64748B;max-width:34ch\">Triángulo inscrito: tres sistemas que se cruzan en la misma estructura. La más analítica, la menos rotunda.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:300px 1fr;gap:64px;align-items:start;padding-top:16px\">\n          <svg width=\"300\" height=\"300\" sc-camel-view-box=\"-30 -30 140 140\">\n            <rect x=\"-18\" y=\"-18\" width=\"116\" height=\"116\" fill=\"none\" stroke=\"#B45309\" stroke-width=\"0.6\" stroke-dasharray=\"3 3\"><\u002Frect>\n            <line x1=\"-18\" y1=\"-23\" x2=\"0\" y2=\"-23\" stroke=\"#64748B\" stroke-width=\"0.6\"><\u002Fline>\n            <text x=\"-9\" y=\"-26\" text-anchor=\"middle\" font-family=\"'Roboto Mono',monospace\" font-size=\"6\" fill=\"#64748B\">1×<\u002Ftext>\n            <circle cx=\"40\" cy=\"40\" r=\"32\" fill=\"none\" stroke=\"#E2E8F0\" stroke-width=\"0.6\"><\u002Fcircle>\n            <line x1=\"0\" y1=\"40\" x2=\"80\" y2=\"40\" stroke=\"#E2E8F0\" stroke-width=\"0.6\"><\u002Fline>\n            <line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"80\" stroke=\"#E2E8F0\" stroke-width=\"0.6\"><\u002Fline>\n            <line x1=\"12.3\" y1=\"24\" x2=\"67.7\" y2=\"56\" stroke=\"#E2E8F0\" stroke-width=\"0.6\"><\u002Fline>\n            <line x1=\"12.3\" y1=\"56\" x2=\"67.7\" y2=\"24\" stroke=\"#E2E8F0\" stroke-width=\"0.6\"><\u002Fline>\n            <polygon points=\"40,8 67.7,24 40,40 12.3,24\" fill=\"#F59E0B\"><\u002Fpolygon>\n            <polygon points=\"67.7,24 67.7,56 40,72 40,40\" fill=\"#10B981\"><\u002Fpolygon>\n            <polygon points=\"12.3,24 40,40 40,72 12.3,56\" fill=\"#0F172A\"><\u002Fpolygon>\n            <text x=\"84\" y=\"17\" font-family=\"'Roboto Mono',monospace\" font-size=\"6\" fill=\"#64748B\">60°<\u002Ftext>\n            <text x=\"84\" y=\"43\" font-family=\"'Roboto Mono',monospace\" font-size=\"6\" fill=\"#64748B\">30°<\u002Ftext>\n          <\u002Fsvg>\n          <div style=\"display:flex;flex-direction:column;gap:0\">\n            <div style=\"display:grid;grid-template-columns:180px 1fr;gap:32px;padding:14px 0;border-top:1px solid #0F172A;font-size:14.5px;line-height:21px\">\n              <div style=\"font-weight:500\">Construcción<\u002Fdiv>\n              <div style=\"color:#334155\">Toda la geometría se deriva de un hexágono regular inscrito en una circunferencia. Los tres rombos comparten los ejes de 30° y 60°.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:180px 1fr;gap:32px;padding:14px 0;border-top:1px solid #E2E8F0;font-size:14.5px;line-height:21px\">\n              <div style=\"font-weight:500\">Resguardo<\u002Fdiv>\n              <div style=\"color:#334155\">1× el ancho de un segmento interno. Nada entra en esa zona: ni tipografía, ni bordes, ni controles, ni series.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:180px 1fr;gap:32px;padding:14px 0;border-top:1px solid #E2E8F0;font-size:14.5px;line-height:21px\">\n              <div style=\"font-weight:500\">Tamaño mínimo<\u002Fdiv>\n              <div style=\"color:#334155\">Digital: bloque completo 120 px, símbolo 24 px, favicon 16 px simplificado. Impreso: 30 mm y 8 mm.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:180px 1fr;gap:32px;padding:14px 0 24px 0;border-top:1px solid #E2E8F0;border-bottom:1px solid #E2E8F0;font-size:14.5px;line-height:21px\">\n              <div style=\"font-weight:500\">Escala<\u002Fdiv>\n              <div style=\"display:flex;align-items:flex-end;gap:28px\">\n                <div style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-start\"><svg width=\"56\" height=\"56\" sc-camel-view-box=\"0 0 80 80\"><polygon points=\"40,8 67.7,24 40,40 12.3,24\" fill=\"#F59E0B\"><\u002Fpolygon><polygon points=\"67.7,24 67.7,56 40,72 40,40\" fill=\"#10B981\"><\u002Fpolygon><polygon points=\"12.3,24 40,40 40,72 12.3,56\" fill=\"#0F172A\"><\u002Fpolygon><\u002Fsvg><div style=\"font-family:'Roboto Mono',monospace;font-size:10px;color:#64748B\">56<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-start\"><svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 80 80\"><polygon points=\"40,8 67.7,24 40,40 12.3,24\" fill=\"#F59E0B\"><\u002Fpolygon><polygon points=\"67.7,24 67.7,56 40,72 40,40\" fill=\"#10B981\"><\u002Fpolygon><polygon points=\"12.3,24 40,40 40,72 12.3,56\" fill=\"#0F172A\"><\u002Fpolygon><\u002Fsvg><div style=\"font-family:'Roboto Mono',monospace;font-size:10px;color:#64748B\">32<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-start\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 80 80\"><polygon points=\"40,8 67.7,24 40,40 12.3,24\" fill=\"#F59E0B\"><\u002Fpolygon><polygon points=\"67.7,24 67.7,56 40,72 40,40\" fill=\"#10B981\"><\u002Fpolygon><polygon points=\"12.3,24 40,40 40,72 12.3,56\" fill=\"#0F172A\"><\u002Fpolygon><\u002Fsvg><div style=\"font-family:'Roboto Mono',monospace;font-size:10px;color:#B45309\">24 mín<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;align-items:flex-start\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 80 80\"><polygon points=\"40,8 67.7,24 67.7,56 40,72 12.3,56 12.3,24\" fill=\"#0F172A\"><\u002Fpolygon><line x1=\"40\" y1=\"8\" x2=\"40\" y2=\"72\" stroke=\"#fff\" stroke-width=\"6\"><\u002Fline><\u002Fsvg><div style=\"font-family:'Roboto Mono',monospace;font-size:10px;color:#64748B\">16 s.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1px;background:#E2E8F0\">\n          <div style=\"background:#0F172A;padding:40px;display:flex;justify-content:center\">\n            <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 80 80\"><polygon points=\"40,8 67.7,24 40,40 12.3,24\" fill=\"#fff\"><\u002Fpolygon><polygon points=\"67.7,24 67.7,56 40,72 40,40\" fill=\"#fff\" fill-opacity=\"0.72\"><\u002Fpolygon><polygon points=\"12.3,24 40,40 40,72 12.3,56\" fill=\"#fff\" fill-opacity=\"0.44\"><\u002Fpolygon><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"background:#F1F5F9;padding:40px;display:flex;justify-content:center\">\n            <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 80 80\"><polygon points=\"40,8 67.7,24 40,40 12.3,24\" fill=\"#0F172A\"><\u002Fpolygon><polygon points=\"67.7,24 67.7,56 40,72 40,40\" fill=\"#0F172A\" fill-opacity=\"0.72\"><\u002Fpolygon><polygon points=\"12.3,24 40,40 40,72 12.3,56\" fill=\"#0F172A\" fill-opacity=\"0.44\"><\u002Fpolygon><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"background:#fff;padding:40px;display:flex;justify-content:center\">\n            <svg width=\"52\" height=\"52\" sc-camel-view-box=\"0 0 80 80\"><polygon points=\"40,8 67.7,24 67.7,56 40,72 12.3,56 12.3,24\" fill=\"none\" stroke=\"#0F172A\" stroke-width=\"4\"><\u002Fpolygon><line x1=\"12.3\" y1=\"24\" x2=\"67.7\" y2=\"56\" stroke=\"#0F172A\" stroke-width=\"4\"><\u002Fline><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"background:#fff;padding:40px;display:flex;flex-direction:column;justify-content:center;gap:14px\">\n            <div style=\"display:flex;align-items:center;gap:12px\">\n              <svg width=\"34\" height=\"34\" sc-camel-view-box=\"0 0 80 80\"><polygon points=\"40,8 67.7,24 40,40 12.3,24\" fill=\"#F59E0B\"><\u002Fpolygon><polygon points=\"67.7,24 67.7,56 40,72 40,40\" fill=\"#10B981\"><\u002Fpolygon><polygon points=\"12.3,24 40,40 40,72 12.3,56\" fill=\"#0F172A\"><\u002Fpolygon><\u002Fsvg>\n              <div style=\"display:flex;flex-direction:column;gap:1px\">\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;line-height:1;letter-spacing:-0.01em\">OEP<\u002Fdiv>\n                <div style=\"font-size:9px;color:#64748B;letter-spacing:0.05em;text-transform:uppercase\">Observatorio Económico de Permisos<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-family:'Roboto Mono',monospace;font-size:10px;color:#64748B\">BLOQUE HORIZONTAL<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:56px 1fr;gap:40px;padding:96px 0 0 0\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;color:#94A3B8\">03<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:40px\">\n        <div style=\"display:grid;grid-template-columns:1fr 380px;gap:96px;align-items:end\">\n          <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:44px;line-height:48px;margin:0;letter-spacing:-0.025em\">El color codifica información<\u002Fh2>\n          <p style=\"margin:0;font-size:14.5px;line-height:22px;color:#334155;text-wrap:pretty\">Verde no significa «bueno»: significa estado definido —aprobado, completado, materializado—. Ámbar no significa «malo»: significa capital, atención, pendiente.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr)\">\n          <div style=\"background:#0F172A;height:200px\"><\u002Fdiv>\n          <div style=\"background:#10B981;height:200px\"><\u002Fdiv>\n          <div style=\"background:#F59E0B;height:200px\"><\u002Fdiv>\n          <div style=\"background:#fff;height:200px;border:1px solid #E2E8F0;border-left:none\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:-24px\">\n          <div style=\"display:flex;flex-direction:column;gap:8px;border-top:1px solid #0F172A;padding-top:14px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px\">Deep Slate<\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:11.5px;color:#64748B\">{{ codigoSlate }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:19px;color:#64748B\">Estructura, totales, series base. 50–65 % de la interfaz.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;border-top:1px solid #0F172A;padding-top:14px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px\">Emerald<\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:11.5px;color:#64748B\">{{ codigoEmerald }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:19px;color:#64748B\">Aprobado, RCA favorable, obras iniciadas, dimensión ambiental.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;border-top:1px solid #0F172A;padding-top:14px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px\">Copper<\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:11.5px;color:#64748B\">{{ codigoCopper }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:19px;color:#64748B\">Inversión, pendiente de materialización, fricción regulatoria.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;border-top:1px solid #0F172A;padding-top:14px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline\"><div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px\">Crisp White<\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:11.5px;color:#64748B\">{{ codigoWhite }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:19px;color:#64748B\">Lienzo analítico. El blanco es funcional: mejora la razón dato-tinta.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1.2fr 1fr;gap:96px;padding-top:24px\">\n          <div style=\"display:flex;flex-direction:column;gap:0\">\n            <div style=\"display:grid;grid-template-columns:56px 96px 1fr;gap:20px;align-items:center;padding:9px 0;border-top:1px solid #0F172A\"><div style=\"height:22px;background:#334155\"><\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:11.5px\">#334155<\u002Fdiv><div style=\"font-size:13.5px;color:#64748B\">slate-700 · texto secundario, etiquetas<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:56px 96px 1fr;gap:20px;align-items:center;padding:9px 0;border-top:1px solid #E2E8F0\"><div style=\"height:22px;background:#64748B\"><\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:11.5px\">#64748B<\u002Fdiv><div style=\"font-size:13.5px;color:#64748B\">slate-500 · ejes, fuentes, metadatos<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:56px 96px 1fr;gap:20px;align-items:center;padding:9px 0;border-top:1px solid #E2E8F0\"><div style=\"height:22px;background:#CBD5E1\"><\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:11.5px\">#CBD5E1<\u002Fdiv><div style=\"font-size:13.5px;color:#64748B\">slate-300 · series no destacadas<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:56px 96px 1fr;gap:20px;align-items:center;padding:9px 0;border-top:1px solid #E2E8F0\"><div style=\"height:22px;background:#E2E8F0\"><\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:11.5px\">#E2E8F0<\u002Fdiv><div style=\"font-size:13.5px;color:#64748B\">slate-200 · bordes y grillas<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:56px 96px 1fr;gap:20px;align-items:center;padding:9px 0;border-top:1px solid #E2E8F0\"><div style=\"height:22px;background:#F1F5F9\"><\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:11.5px\">#F1F5F9<\u002Fdiv><div style=\"font-size:13.5px;color:#64748B\">slate-100 · geografía base, filas alternas<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:56px 96px 1fr;gap:20px;align-items:center;padding:9px 0;border-top:1px solid #E2E8F0;border-bottom:1px solid #E2E8F0\"><div style=\"height:22px;background:#F8FAFC;outline:1px solid #E2E8F0\"><\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:11.5px\">#F8FAFC<\u002Fdiv><div style=\"font-size:13.5px;color:#64748B\">slate-50 · superficie de reposo<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <div style=\"display:flex;height:40px\">\n              <div style=\"flex:65;background:#F8FAFC;outline:1px solid #E2E8F0\"><\u002Fdiv>\n              <div style=\"flex:27;background:#0F172A\"><\u002Fdiv>\n              <div style=\"flex:5;background:#10B981\"><\u002Fdiv>\n              <div style=\"flex:3;background:#F59E0B\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;font-family:'Roboto Mono',monospace;font-size:10.5px;color:#64748B\"><div>65 NEUTRO<\u002Fdiv><div>27 SLATE<\u002Fdiv><div style=\"color:#047857\">5<\u002Fdiv><div style=\"color:#B45309\">3<\u002Fdiv><\u002Fdiv>\n            <p style=\"margin:0;font-size:14.5px;line-height:22px;color:#334155;text-wrap:pretty\">Emerald y Copper son señales: su fuerza depende de la escasez, con 5–10 % combinado como techo. Si todo está en color, nada destaca.<\u002Fp>\n            <div style=\"font-size:13.5px;line-height:20px;color:#64748B;border-top:1px solid #E2E8F0;padding-top:14px\">Jerarquía de lectura: Slate estructura → blanco lienzo → Emerald estado ambiental → Copper estado económico.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:56px 1fr;gap:40px;padding:96px 0 0 0\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;color:#94A3B8\">04<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:40px\">\n        <div style=\"display:grid;grid-template-columns:1fr 380px;gap:96px;align-items:end\">\n          <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:44px;line-height:48px;margin:0;letter-spacing:-0.025em\">Tres familias, tres funciones<\u002Fh2>\n          <p style=\"margin:0;font-size:14.5px;line-height:22px;color:#334155;text-wrap:pretty\">Space Grotesk da el carácter técnico en títulos e indicadores. Inter sostiene interfaz y editorial. Roboto Mono identifica lo que es código, fecha técnica o metadato.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:56px;border-top:1px solid #0F172A;padding-top:24px\">\n          <div style=\"display:flex;align-items:baseline;gap:24px\">\n            <div style=\"font-family ily=\"Inter,sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"#0F172A\">En construcción<\u002Ftext>\n              <text x=\"642\" y=\"42\" font-family=\"'Roboto Mono',monospace\" font-size=\"11\" fill=\"#64748B\">270<\u002Ftext>\n              <text x=\"642\" y=\"100\" font-family=\"Inter,sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"#0F172A\">Pendiente<\u002Ftext>\n              <text x=\"642\" y=\"116\" font-family=\"'Roboto Mono',monospace\" font-size=\"11\" fill=\"#64748B\">364<\u002Ftext>\n              <text x=\"642\" y=\"206\" font-family=\"Inter,sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"#334155\">En trámite<\u002Ftext>\n              <text x=\"642\" y=\"222\" font-family=\"'Roboto Mono',monospace\" font-size=\"11\" fill=\"#64748B\">424<\u002Ftext>\n            <\u002Fsvg>\n            <div style=\"font-size:11.5px;line-height:17px;color:#64748B;border-top:1px solid #E2E8F0;padding-top:10px\">Fuente: SEA, organismos sectoriales. Cálculos OEP. Nodos en la secuencia real del proceso; flujos al 18–28 % de opacidad.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:340px 1fr;gap:64px\">\n          <div style=\"display:flex;flex-direction:column;gap:16px\">\n            <div style=\"border-bottom:1px solid #0F172A;padding-bottom:10px\">\n              <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px;line-height:25px\">La inversión pendiente se concentra en el norte<\u002Fdiv>\n              <div style=\"font-size:13px;color:#64748B;padding-top:3px\">Área del círculo = inversión pendiente · US$ BN<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding:8px 130px 8px 0\">\n              <x-import component-from-global-scope=\"oep-chile-map\" width=\"170\" height=\"470\" hint-size=\"170px,470px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"font-size:11.5px;line-height:17px;color:#64748B;border-top:1px solid #E2E8F0;padding-top:10px\">Geografía: Natural Earth. Datos: SEA, cálculos OEP. Base en Slate 100–300; los puntos quedan subordinados hasta la selección.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-direction:column;gap:48px\">\n            <div style=\"display:flex;flex-direction:column;gap:20px\">\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:48px;border-top:1px solid #0F172A;padding-top:16px\">\n                <div style=\"display:flex;flex-direction:column;gap:10px\">\n                  <div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#047857\">ANOTACIÓN PREFERIDA<\u002Fdiv>\n                  <div style=\"border-left:1px dashed #CBD5E1;padding-left:12px\"><div style=\"font-family:'Roboto Mono',monospace;font-size:11px;color:#334155\">2024-T3<\u002Fdiv><div style=\"font-size:11px;color:#64748B\">cambio metodológico<\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:10px\">\n                  <div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#94A3B8\">EVITAR<\u002Fdiv>\n                  <div style=\"border-left:1px dashed #E2E8F0;padding-left:12px;font-size:11px;color:#94A3B8;line-height:15px\">A partir del tercer trimestre de 2024 se introdujo un cambio en la metodología de cálculo que afecta la comparabilidad de la serie respecto de los períodos anteriores…<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:14.5px;line-height:22px;color:#334155;max-width:70ch\">Las anotaciones marcan quiebres estructurales, cambios regulatorios o metodológicos y proyectos excepcionales. Dos líneas como máximo, nunca un párrafo dentro del gráfico.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div id=\"metodologia\" style=\"display:flex;flex-direction:column;gap:16px\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #0F172A;padding-bottom:10px\">\n                <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:19px\">Inversión pendiente de materialización<\u002Fdiv>\n                <div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#64748B\">FICHA METODOLÓGICA<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column\">\n                <div style=\"display:grid;grid-template-columns:132px 1fr;gap:24px;padding:9px 0;border-bottom:1px solid #F1F5F9;font-size:13.5px;line-height:20px\"><div style=\"color:#64748B\">Definición<\u002Fdiv><div>Inversión declarada de proyectos con RCA favorable vigente que no registran inicio de obras.<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:132px 1fr;gap:24px;padding:9px 0;border-bottom:1px solid #F1F5F9;font-size:13.5px;line-height:20px\"><div style=\"color:#64748B\">Fórmula<\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:12.5px\">Σ inversión declarada | RCA = favorable ∧ obras = no iniciadas<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:132px 1fr;gap:24px;padding:9px 0;border-bottom:1px solid #F1F5F9;font-size:13.5px;line-height:20px\"><div style=\"color:#64748B\">Fuente<\u002Fdiv><div>SEA (expedientes), organismos sectoriales, seguimiento OEP.<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:132px 1fr;gap:24px;padding:9px 0;border-bottom:1px solid #F1F5F9;font-size:13.5px;line-height:20px\"><div style=\"color:#64748B\">Cobertura<\u002Fdiv><div>2015–2026. Excluye modificaciones sin nueva inversión asociada.<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:132px 1fr;gap:24px;padding:9px 0;border-bottom:1px solid #F1F5F9;font-size:13.5px;line-height:20px\"><div style=\"color:#64748B\">Limitaciones<\u002Fdiv><div>Los montos son declarados por el titular y pueden diferir del capital efectivamente ejecutado.<\u002Fdiv><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:132px 1fr;gap:24px;padding:9px 0;border-bottom:1px solid #E2E8F0;font-size:13.5px;line-height:20px\"><div style=\"color:#64748B\">Frecuencia<\u002Fdiv><div>Trimestral, con revisión del período anterior.<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;gap:24px;font-size:11.5px;color:#64748B\"><div>Fuente: SEA, SMA, organismos sectoriales. Cálculos OEP.<\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace\">ACT. 03.09.2026<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:56px 1fr;gap:40px;padding:96px 0 0 0\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;color:#94A3B8\">07<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:40px\">\n        <div style=\"display:grid;grid-template-columns:1fr 380px;gap:96px;align-items:end\">\n          <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:44px;line-height:48px;margin:0;letter-spacing:-0.025em\">El titular es el hallazgo<\u002Fh2>\n          <p style=\"margin:0;font-size:14.5px;line-height:22px;color:#334155;text-wrap:pretty\">Autoridad cuando la evidencia lo respalda, objetividad sin encuadre político, transparencia sobre los supuestos. Lo observado se separa siempre de la interpretación.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column\">\n          <div style=\"display:grid;grid-template-columns:88px 1fr 1fr;gap:40px;padding:20px 0;border-top:1px solid #0F172A;align-items:baseline\">\n            <div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#64748B\">TITULAR<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:22px;line-height:28px;color:#CBD5E1;text-decoration:line-through;text-decoration-thickness:1px\">Análisis de permisos ambientales<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;line-height:28px;letter-spacing:-0.015em\">Los tiempos de evaluación aumentaron 18 % en un año<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:88px 1fr 1fr;gap:40px;padding:20px 0;border-top:1px solid #E2E8F0;align-items:baseline\">\n            <div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#64748B\">TITULAR<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:22px;line-height:28px;color:#CBD5E1;text-decoration:line-through;text-decoration-thickness:1px\">Inversión regional<\u002Fdiv>\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:22px;line-height:28px;letter-spacing:-0.015em\">Antofagasta concentra 30 % de la inversión aprobada pendiente<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:88px 1fr 1fr;gap:40px;padding:20px 0;border-top:1px solid #E2E8F0;border-bottom:1px solid #E2E8F0;align-items:baseline\">\n            <div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#64748B\">CUERPO<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:22px;color:#94A3B8\">Cabe señalar que, en función de lo anteriormente expuesto, los resultados parecerían sugerir un aumento considerable en los plazos.<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:22px;color:#334155\">La mediana de tramitación aumentó de 112 a 148 días. El alza refleja tanto una cartera mayor como una materialización más lenta.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1.4fr;gap:96px\">\n Fline><line x1=\"8\" y1=\"12\" x2=\"16\" y2=\"12\"><\u002Fline><\u002Fsvg><div style=\"font-size:10.5px;color:#64748B\">Proyecto<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#334155\" stroke-width=\"1.7\"><line x1=\"4\" y1=\"19\" x2=\"20\" y2=\"19\"><\u002Fline><polyline points=\"5,15 10,10 14,13 20,6\"><\u002Fpolyline><polyline points=\"15,6 20,6 20,11\"><\u002Fpolyline><\u002Fsvg><div style=\"font-size:10.5px;color:#64748B\">Inversión<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#334155\" stroke-width=\"1.7\"><polygon points=\"12,3 20,7.5 20,16.5 12,21 4,16.5 4,7.5\"><\u002Fpolygon><\u002Fsvg><div style=\"font-size:10.5px;color:#64748B\">Ambiente<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#334155\" stroke-width=\"1.7\"><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\"><\u002Frect><polyline points=\"8,12 11,15 16,9\"><\u002Fpolyline><\u002Fsvg><div style=\"font-size:10.5px;color:#64748B\">Permiso<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#334155\" stroke-width=\"1.7\"><line x1=\"3\" y1=\"20\" x2=\"21\" y2=\"20\"><\u002Fline><polygon points=\"12,5 19,20 5,20\"><\u002Fpolygon><\u002Fsvg><div style=\"font-size:10.5px;color:#64748B\">Construcción<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#334155\" stroke-width=\"1.7\"><rect x=\"4\" y=\"5\" width=\"16\" height=\"16\"><\u002Frect><line x1=\"4 <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:64px;border-top:1px solid #0F172A;padding-top:20px\">\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#64748B\">MOVIMIENTO<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:0;font-size:13.5px\">\n              <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F1F5F9\"><span>Cambio de filtro<\u002Fspan><span style=\"font-family:'Roboto Mono',monospace;color:#64748B\">180 ms<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F1F5F9\"><span>Transición de gráfico<\u002Fspan><span style=\"font-family:'Roboto Mono',monospace;color:#64748B\">280 ms<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F1F5F9\"><span>Actualización de cifra<\u002Fspan><span style=\"font-family:'Roboto Mono',monospace;color:#64748B\">240 ms<\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #F1F5F9\"><span>Navegación<\u002Fspan><span style=\"font-family:'Roboto Mono',monospace;color:#64748B\">320 ms<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;line-height:19px;color:#64748B\">Los datos se sienten vivos; la interfaz no está inquieta. Sin parallax, brillos ni degradados animados.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#64748B\">BORDES, RADIOS Y ELEVACIÓN<\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:flex-end\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"width:60px;height:40px;border:1px solid #E2E8F0;border-radius:6px\"><\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:10px;color:#64748B\">6<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"width:60px;height:40px;border:1px solid #E2E8F0;border-radius:8px\"><\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:10px;color:#64748B\">8<\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:6px\"><div style=\"width:60px;height:40px;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,0.05)\"><\u002Fdiv><div style=\"font-family:'Roboto Mono',monospace;font-size:10px;color:#64748B\">10<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:13px;line-height:19px;color:#64748B\">Jerarquía en este orden: espaciado, tipografía, contraste de fondo, filete y —solo al final— sombra.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#64748B\">ACCESIBILIDAD · WCAG AA<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;font-size:13.5px;line-height:20px;color:#334155\">\n              <div>El color nunca es el único portador de significado: estado = color + etiqueta + marcador.<\u002Fdiv>\n              <div>Ámbar no se usa en texto pequeño sobre blanco; ahí va <span style=\"color:#B45309;font-weight:600\">#B45309<\u002Fspan>.<\u002Fdiv>\n              <div>Toda visualización relevante ofrece alternativa tabular y etiquetas descriptivas.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:96px;border-top:1px solid #0F172A;padding-top:20px\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#047857\">SÍ<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px;font-size:14.5px;line-height:21px;color:#334155\">\n              <div>Abrir con la evidencia y la cifra.<\u002Fdiv>\n              <div>Priorizar números sobre decoración.<\u002Fdiv>\n              <div>Usar el blanco de forma intencionada.<\u002Fdiv>\n              <div>Mantener el color semántico disciplinado.<\u002Fdiv>\n              <div>Exponer la metodología y sus límites.<\u002Fdiv>\n              <div>Etiquetar las series directamente.<\u002Fdiv>\n              <div>Destacar lo relevante y atenuar el resto.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <div style=\"font-family:'Roboto Mono',monospace;font-size:10.5px;color:#B45309\">NO<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:7px;font-size:14.5px;line-height:21px;color:#94A3B8\">\n              <div>Pintar cada cifra de verde o ámbar.<\u002Fdiv>\n              <div>Paletas arcoíris y degradados decorativos.<\u002Fdiv>\n              <div>Meter todo dentro de una tarjeta redondeada.<\u002Fdiv>\n              <div>Sombras grandes y gráficos 3D.<\u002Fdiv>\n              <div>Gauges donde basta un número o una barra.<\u002Fdiv>\n              <div>Presentar estimaciones como hechos observados.<\u002Fdiv>\n              <div>Complejidad visual para parecer sofisticado.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:56px 1fr;gap:40px;padding:96px 0 0 0\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;color:#94A3B8\">08<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap: 0px\">Bajo 24 px se simplifica la geometría antes que reducir el grosor: hexágono sólido con un solo corte.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background:#0F172A;color:#CBD5E1;padding:64px 0\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:56px 1fr;gap:40px\">\n      <div style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:15px;color:#64748B\">09<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:32px\">\n        <h2 style=\"font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:44px;line-height:48px;margin:0;letter-spacing:-0.025em;color:#fff\">Tokens<\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:64px;font-family:'Roboto Mono',monospace;font-size:12.5px;line-height:22px;border-top:1px solid #334155;padding-top:24px\">\n          <div>\n            <div style=\"color:#64748B\">/* MARCA */<\u002Fdiv>\n            <div>--oep-slate: <span style=\"color:#F59E0B\">#0F172A<\u002Fspan>;<\u002Fdiv>\n            <div>--oep-emerald: <span style=\"color:#F59E0B\">#10B981<\u002Fspan>;<\u002Fdiv>\n            <div>--oep-copper: <span style=\"color:#F59E0B\">#F59E0B<\u002Fspan>;<\u002Fdiv>\n            <div>--oep-white: <span style=\"color:#F59E0B\">#FFFFFF<\u002Fspan>;<\u002Fdiv>\n            <div style=\"height:22px\"><\u002Fdiv>\n            <div style=\"color:#64748B\">/* NEUTRALES */<\u002Fdiv>\n            <div>--slate-700: <span style=\"color:#F59E0B\">#334155<\u002Fspan>;<\u002Fdiv>\n            <div>--slate-500: <span style=\"color:#F59E0B\">#64748B<\u002Fspan>;<\u002Fdiv>\n            <div>--slate-300: <span style=\"color:#F59E0B\">#CBD5E1<\u002Fspan>;<\u002Fdiv>\n            <div>--slate-200: <span style=\"color:#F59E0B\">#E2E8F0<\u002Fspan>;<\u002Fdiv>\n            <div>--slate-100: <span style=\"color:#F59E0B\">#F1F5F9<\u002Fspan>;<\u002Fdiv>\n            <div>--slate-50: <span style=\"color:#F59E0B\">#F8FAFC<\u002Fspan>;<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"color:#64748B\">/* TIPOGRAFÍA */<\u002Fdiv>\n            <div>--font-display: <span style=\"color:#10B981\">\"Space Grotesk\"<\u002Fspan>;<\u002Fdiv>\n            <div>--font-body: <span style=\"color:#10B981\">\"Inter\"<\u002Fspan>;<\u002Fdiv>\n            <div>--font-mono: <span style=\"color:#10B981\">\"Roboto Mono\"<\u002Fspan>;<\u002Fdiv>\n            <div style=\"height:22px\"><\u002Fdiv>\n            <div style=\"color:#64748B\">/* ESPACIADO */<\u002Fdiv>\n            <div>--space-1…16: <span style=\"color:#F59E0B\">8 16 24 32 48 64 96 128<\u002Fspan>;<\u002Fdiv>\n            <div style=\"height:22px\"><\u002Fdiv>\n            <div style=\"color:#64748B\">/* UI */<\u002Fdiv>\n            <div>--radius-small: <span style=\"color:#F59E0B\">6px<\u002Fspan>;<\u002Fdiv>\n            <div>--radius-medium: <span style=\"color:#F59E0B\">8px<\u002Fspan>;<\u002Fdiv>\n            <div>--radius-large: <span style=\"color:#F59E0B\">10px<\u002Fspan>;<\u002Fdiv>\n            <div>--border-default: <span style=\"color:#F59E0B\">#E2E8F0<\u002Fspan>;<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;gap:32px;font-family:'Roboto Mono',monospace;font-size:10.5px;color:#64748B;border-top:1px solid #334155;padding-top:20px\">\n          <div>OEP · KIT DE INTERFAZ · V 1.0<\u002Fdiv>\n          <div>CIFRAS DE MUESTRA CON ESTRUCTURA REAL<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;marcaSeleccionada&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;A&quot;, &quot;B&quot;, &quot;C&quot;, &quot;ninguna&quot;], &quot;default&quot;: &quot;A&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Logotipo&quot;},\n  &quot;mostrarGrilla&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Diagramas&quot;},\n  &quot;mostrarCodigos&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Diagramas&quot;}\n}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const sel = this.props.marcaSeleccionada ?? \"A\";\n    const cod = this.props.mostrarCodigos ?? true;\n    return {\n      marcaA: sel === \"A\",\n      marcaB: sel === \"B\",\n      marcaC: sel === \"C\",\n      mostrarGrilla: this.props.mostrarGrilla ?? true,\n      codigoSlate: cod ? \"#0F172A\" : \"--oep-slate\",\n      codigoEmerald: cod ? \"#10B981\" : \"--oep-emerald\",\n      codigoCopper: cod ? \"#F59E0B\" : \"--oep-copper\",\n      codigoWhite: cod ? \"#FFFFFF\" : \"--oep-white\"\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
